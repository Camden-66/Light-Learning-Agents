[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "light-learning-agents"
version = "0.1.0"
description = "A reproducible room benchmark for sequential learning agents."
readme = "readme.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gymnasium>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]
rl = [
  "stable-baselines3>=2.7,<3.0",
]

[project.scripts]
light-learning = "light_learning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/light_learning"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "light_learning/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
